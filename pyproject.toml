[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "Fully local Russian/mixed-language meeting transcription with speaker diarization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "meeting-transcriber contributors" }]
dependencies = [
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
asr = [
  "faster-whisper==1.1.1",
  "av>=11,<17",
]
diarization = [
  "nemo_toolkit[asr]==2.6.2",
  "silero-vad==6.2.3",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
meeting-transcriber = "meeting_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: requires an NVIDIA GPU and downloaded model weights",
  "integration: exercises the full pipeline with fake backends",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
